<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tawqir Pata - Golpor Duniya</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            color: #333;
        }
        header {
            background-color: #ffffff;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
        }
        header h1 {
            color: #d35400;
            margin: 0;
            font-size: 28px;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .section-title {
            text-align: center;
            color: #2980b9;
            font-size: 24px;
            margin-bottom: 30px;
        }
        .story-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s;
        }
        .story-card:hover {
            transform: translateY(-3px);
        }
        .story-thumb {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            background-color: #eee;
        }
        .story-title {
            color: #c0392b;
            font-size: 22px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }
        .story-title:hover {
            text-decoration: underline;
        }
        .story-snippet {
            color: #555;
            font-size: 16px;
            line-height: 1.5;
            max-height: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <header>
        <h1>Tawqir Pata</h1>
    </header>

    <div class="container">
        <h2 class="section-title">Latest Online Storybooks</h2>
        <div id="story-container">
            <p style="text-align:center;">Loading stories...</p>
        </div>
    </div>

    <script>
        // Sothik username ebong repository name ("Site") set kora holo
        const username = "tawqirmahmudi-cloud";
        const repo = "Site";

        async function loadStories() {
            const container = document.getElementById('story-container');
            
            try {
                const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/story`);
                const files = await response.json();

                if (!Array.isArray(files)) {
                    container.innerHTML = "<p style='text-align:center;'>Kono golpo pawa jayni!</p>";
                    return;
                }

                container.innerHTML = ""; // Clear loading text

                for (let file of files) {
                    if (file.name.endsWith('.txt')) {
                        const baseName = file.name.replace('.txt', '');
                        
                        // Text file er content pora hocche
                        const textResponse = await fetch(file.download_url);
                        const textContent = await textResponse.text();
                        
                        // Image er path
                        const imgUrl = `pic/${baseName}.jpg`;

                        const card = document.createElement('div');
                        card.className = 'story-card';
                        
                        card.innerHTML = `
                            <img src="${imgUrl}" alt="${baseName}" class="story-thumb" onerror="this.style.display='none'">
                            <br>
                            <a href="reader.html?story=${baseName}" class="story-title">${baseName.replace(/-/g, ' ')}</a>
                            <p class="story-snippet">${textContent.substring(0, 150)}...</p>
                        `;
                        
                        container.appendChild(card);
                    }
                }
            } catch (error) {
                console.error('Error loading stories:', error);
                container.innerHTML = "<p style='text-align:center;'>Golpo load korte shomossha hocche.</p>";
            }
        }

        loadStories();
    </script>
</body>
</html>
